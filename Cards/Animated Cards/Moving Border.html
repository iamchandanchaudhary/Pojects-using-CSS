<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border Animation</title>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #091a22;

            display: flex;
            align-items: center;
            justify-content: center;

            height: 100vh;
            width: 100vw;
        }

        .card {
            width: 250px;
            height: 250px;

            position: relative;

            color: #fff;
            background-color: #0e242e;

            /* border: 2px solid #fff; */
            border-radius: 10px;
            padding: 20px;

            text-align: center;
            font-size: 20px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        @property --angle {
            syntax: "<angle>";
            initial-value: 0deg;
            inherits: false;
        }

        .card::after,
        .card::before {
            /* --angle: 0deg; */

            content: "";
            position: absolute;
            height: 100%;
            width: 100%;

            /* background-color: #fff; */
            /* background-image: conic-gradient(red, green); */
            background-image: conic-gradient(from var(--angle), transparent 70%, red);
            z-index: -1;
            border-radius: 10px;

            left: 50%;
            top: 50%;
            translate: -50% -50%;

            padding: 5px;

            animation: border-ani 3s ease-in-out infinite;
        }

        .card::before {
            filter: blur(1.5rem);
            opacity: 0.5;
        }

        @keyframes border-ani {
            from {
                --angle: 0deg;
            }

            to {
                --angle: 360deg;
            }
        }
    </style>
</head>

<body>

    <div class="card">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Nemo sit fugiat iste ad molestias. Aliquam, ducimus
        repellat quidem quas eius quaerat facere voluptate voluptatem optio! Rerum modi facere deserunt explicabo!
    </div>

</body>

</html>
